name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (pyflakes)
        run: >-
          python -m pyflakes token_tracker.py fleet audit_daemon.py
          tracker_live.py public_surface.py integrations/nougen_usage_mcp.py
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke
        run: python token_tracker.py --help

  trckr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/trckr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test (parsers, engine, OAuth, MCP, hook)
        run: npm test
